<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraft – Contact</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="logo">CodeCraft</div>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label">
        <i class="fas fa-bars"></i>
      </label>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero contact-hero">
        <h1>Get in Touch</h1>
        <p>
          We’d love to hear from you – whether it’s a question, feedback, or
          just a hello.
        </p>
      </section>

      <section class="contact-form-section">
        <div class="contact-info">
          <h2>Reach Us</h2>
          <p><i class="fas fa-envelope"></i> hello@codecraft.dev</p>
          <p><i class="fas fa-phone"></i> +1 (800) 555‑CODE</p>
          <p>
            <i class="fas fa-map-marker-alt"></i> 123 Tech Lane, SF, CA 94105
          </p>
        </div>

        <form class="contact-form" action="#" method="post">
          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g. Jane Doe"
            required
          />

          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="jane@example.com"
            required
          />

          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Tell us what’s on your mind…"
            required
          ></textarea>

          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 CodeCraft. All rights reserved.</p>
      <div class="social-icons">
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      </div>
    </footer>
  </body>
</html>
